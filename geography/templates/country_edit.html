{% extends "base.html" %}

{% block content %}

    <h2>Edit country</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save changes
        </button>

        <a href="/countries/" class="btn btn-secondary" role="button">Cancel</a>
    </form>

    <p class="mt-4">
        <a href="/countries/">Back to country list</a>
    </p>


{% endblock %}
