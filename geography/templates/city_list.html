
{% extends 'base.html' %}

{% load humanize %}

{% block content %}

    <h1 class="mb-4">Cities</h1>

    <div class="d-flex justify-content-between flex-wrap align-items-center mb-3">
            <a href="/cities/new/" class="btn btn-primary">
                Add a city
            </a>
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Country</th>
            <th scope="col">Population</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for city in cities %}
            <tr>
              <td class="text-break">{{ city.city_name }}</td>
              <td class="text-break">{{ city.country.name }}</td>
                <td>{{ city.population }}</td>
                <td>
                    <a href="/cities/{{ city.pk }}/edit/">
                        Edit
                    </a>

                    <a href="/cities/{{ city.pk }}/delete/">
                        Delete
                    </a>
                </td>
            </tr>
          {% empty %}
            <tr>
                <td colspan="4" class="text-center text-muted">
                    No cities have been added yet.
                </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
{% endblock %}
