{% extends "base.html" %}

{% block content %}

	<h1>Delete country</h1>

	<p>
	    Are you sure you want to delete
	    <strong>{{ country.name }}</strong>?
	</p>

	<form method="post">
	    {% csrf_token %}

	    <button type="submit">Yes, delete</button>
	    <a href="/countries/">Cancel</a>
	</form>

    <p>
        <a href="/countries/">Back to country list</a>
    </p>


{% endblock %}
