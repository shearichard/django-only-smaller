{% extends "base.html" %}

{% block content %}

    <h2>Add Country</h2>

    <form method="post">

        {% csrf_token %}

        {{form.as_p}}

        <button type="submit" class="btn btn-primary">
            Add Country
        </button>

        <a href="/cities/" class="btn btn-secondary" role="button">Cancel</a>

    </form>

    <p class="mt-4">
        <a href="/countries/">Back to country list</a>
    </p>


{% endblock %}
