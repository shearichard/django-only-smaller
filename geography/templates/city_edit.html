{% extends "base.html" %}

{% block content %}

    <h2>Edit city</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save changes
        </button>

        <a href="/cities/" class="btn btn-secondary" role="button">Cancel</a>

    </form>

    <p class="mt-4">
        <a href="/cities/">Back to city list</a>
    </p>


{% endblock %}
