{% extends "base.html" %}

{% block content %}

    <h2>Add City</h2>

    <form method="post">

        {% csrf_token %}

        {{form.as_p}}

        <button type="submit" class="btn btn-primary">
            Add City
        </button>

        <a href="/cities/" class="btn btn-secondary" role="button">Cancel</a>

    </form>

    <p class="mt-4">
        <a href="/cities/">Back to city list</a>
    </p>


{% endblock %}
